name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include Codex transcripts, rollout data, credentials, account details, or private filesystem paths.

  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS, Stream Deck App, and Codex App versions
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Stream Deck model
      description: For example Stream Deck +, 15-key Stream Deck, Mini, Neo, or XL
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove private paths, task identifiers, transcripts, and credentials.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed private data and credentials from this report.
          required: true
