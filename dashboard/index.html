<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Live activity log for the Stream Deck Codex Companion build."
    />
    <title>Stream Deck Codex Companion — Live Activity</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #fbfaf6;
        --foreground: #191816;
        --muted: #6f6b64;
        --rule: #dedbd3;
        --live: #2e7d4f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #151514;
          --foreground: #f2f0ea;
          --muted: #a6a198;
          --rule: #34322f;
          --live: #70c48f;
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        background: var(--background);
      }
      body {
        max-width: 860px;
        margin: 0 auto;
        padding: 28px 20px 64px;
        background: var(--background);
        color: var(--foreground);
        font:
          16px/1.5 ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      header {
        position: sticky;
        z-index: 1;
        top: 0;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 18px;
        padding: 16px 0 14px;
        border-bottom: 1px solid var(--rule);
        background: color-mix(in srgb, var(--background) 94%, transparent);
        backdrop-filter: blur(12px);
      }
      h1 {
        margin: 0;
        font-size: clamp(21px, 4vw, 29px);
        line-height: 1.2;
      }
      .status {
        display: inline-flex;
        flex: none;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--live);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--live) 16%, transparent);
      }
      .offline .dot {
        background: #a34040;
        box-shadow: none;
      }
      .meta {
        margin: 13px 0 22px;
        color: var(--muted);
        font-size: 13px;
      }
      ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li {
        display: grid;
        grid-template-columns: 62px minmax(0, 1fr);
        gap: 14px;
        padding: 13px 0;
        border-bottom: 1px solid var(--rule);
      }
      time {
        padding-top: 2px;
        color: var(--muted);
        font:
          12px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        text-align: right;
      }
      .line {
        overflow-wrap: anywhere;
      }
      .empty {
        color: var(--muted);
      }
      @media (max-width: 520px) {
        body {
          padding: 10px 14px 48px;
        }
        header {
          align-items: center;
        }
        li {
          grid-template-columns: 48px minmax(0, 1fr);
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Live build activity</h1>
      <div class="status" id="status">
        <span class="dot"></span><span id="status-label">LIVE</span>
      </div>
    </header>
    <p class="meta" id="meta">Connecting to the local build status…</p>
    <ol id="feed" aria-live="polite">
      <li class="empty">
        <time>now</time
        ><span class="line">Waiting for the first status update.</span>
      </li>
    </ol>
    <script>
      const feed = document.querySelector("#feed");
      const meta = document.querySelector("#meta");
      const status = document.querySelector("#status");
      const statusLabel = document.querySelector("#status-label");
      let lastPayload = "";

      function plainLine(entry) {
        const title = String(entry.title || "")
          .replace(/\s+/g, " ")
          .trim();
        const detail = String(entry.detail || "")
          .replace(/\s+/g, " ")
          .trim();
        return title && detail
          ? `${title} — ${detail}`
          : title || detail || "Work status changed.";
      }

      function render(data) {
        const entries = [...(data.activity || [])].reverse();
        feed.innerHTML = entries.length
          ? entries
              .map(
                (entry) => `
              <li>
                <time datetime="${entry.at || ""}">${displayTime(entry.at)}</time>
                <span class="line">${escapeHtml(entry.line || plainLine(entry))}</span>
              </li>`,
              )
              .join("")
          : `<li class="empty"><time>now</time><span class="line">No activity has been recorded yet.</span></li>`;

        const newestActivityAt = entries[0]?.at || data.updatedAt;
        const updated = newestActivityAt
          ? new Date(newestActivityAt).toLocaleTimeString([], {
              hour: "numeric",
              minute: "2-digit",
              second: "2-digit",
            })
          : "unknown";
        meta.textContent = `Newest update first · automatic refresh every 2 seconds · last change ${updated}`;
        document.title = `${data.project || "Stream Deck Codex Companion"} — Live Activity`;
      }

      function escapeHtml(value) {
        return value.replace(
          /[&<>"']/g,
          (character) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[character],
        );
      }

      function displayTime(value) {
        if (!value) return "now";
        const parsed = new Date(value);
        return Number.isNaN(parsed.valueOf())
          ? value
          : parsed.toLocaleTimeString([], {
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit",
            });
      }

      async function refresh() {
        try {
          const response = await fetch("/api/status", { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          const payload = JSON.stringify(data);
          if (payload !== lastPayload) {
            render(data);
            lastPayload = payload;
          }
          status.classList.remove("offline");
          statusLabel.textContent = "LIVE";
        } catch {
          status.classList.add("offline");
          statusLabel.textContent = "RETRYING";
          meta.textContent =
            "The local status endpoint is unavailable; retrying every 2 seconds.";
        }
      }

      refresh();
      setInterval(refresh, 2000);
    </script>
  </body>
</html>
